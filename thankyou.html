<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณ | Cofe Dawn</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 5rem);
      min-height: calc(100svh - 5rem);
      padding-block: var(--space-6);
      text-align: center;
    }
    .thanks h1 { font-size: var(--text-2xl); }
    .thanks .rule { margin: var(--space-3) auto var(--space-4); }

</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Cofe Dawn</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="container">
        <h1>ขอบคุณที่สั่งซื้อ</h1>
        <hr class="rule">
        <p class="lead">เราได้รับคำสั่งซื้อของคุณแล้ว ขอบคุณที่เลือก Cofe Dawn เป็นแก้วโปรดของคุณ</p>
        <a class="btn" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 Cofe Dawn</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
