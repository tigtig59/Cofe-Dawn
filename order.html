<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Cofe Dawn</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .section__head h1 { font-size: var(--text-2xl); }
    .form .btn { justify-self: start; margin-top: var(--space-2); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Cofe Dawn</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1>สั่งซื้อ</h1>
          <hr class="rule">
          <p class="lead">กรอกข้อมูลของคุณเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 Cofe Dawn</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
